server:
  port: 8083

jwt:
  secret: ${JWT_SECRET:dev-only-secret-for-local-development-only}

spring:
  cloud:
    sentinel:
      transport:
        dashboard: localhost:8858
      eager: true
    gateway:
      routes:
        # 路由到 tea-mall-backend 服务
        - id: tea-mall-backend
          uri: lb://tea-mall-backend
          predicates:
            - Path=/api/**
        # 路由到 actuator 健康检查
        - id: actuator
          uri: lb://tea-mall-backend
          predicates:
            - Path=/actuator/**
