spring:
  profiles:
    active: dev
  config:
    import: optional:application-dev.yaml
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: tea-mall-backend

  # 数据库配置（必须正确！）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_tea_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456   

  data:
    redis:
      host: localhost
      port: 6379

  # 热部署
  devtools:
    restart:
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xytgy.teamallbackend.module.user.entity,com.xytgy.teamallbackend.module.product.entity,com.xytgy.teamallbackend.module.cart.entity,com.xytgy.teamallbackend.module.order.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志


server:
  port: 8080

jwt:
  # 至少 32 字符，生产环境请使用更强随机密钥并通过环境变量注入
  secret: tea-mall-backend-jwt-secret-key-2026
  access-token-expiration-ms: 1800000 # 30 分钟
  refresh-token-expiration-ms: 604800000 # 7 天

knife4j:
  enable: true
  setting:
    language: zh_cn
