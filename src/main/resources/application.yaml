spring:
  application:
    name: tea-mall-backend

  # 数据库配置（必须正确！）
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://localhost:3306/cloud_tea_db?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
    username: root
    password: 123456   

  data:
    redis:
      host: localhost
      port: 6379

  # 热部署
  devtools:
    restart:
      enabled: true

mybatis-plus:
  mapper-locations: classpath*:/com/xytgy/teamallbackend/mapper/**/*.xml
  type-aliases-package: com.xytgy.teamallbackend.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.stdout.StdOutImpl # 打印SQL日志


server:
  port: 8080

jwt:
  # 至少 32 字符，生产环境请使用更强随机密钥并通过环境变量注入
  secret: tea-mall-backend-jwt-secret-key-2026
  expiration-ms: 86400000
