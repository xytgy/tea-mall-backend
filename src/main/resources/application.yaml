spring:
  profiles:
    active: ${SPRING_PROFILES_ACTIVE:dev}
  flyway:
    enabled: true
    locations: classpath:db/migration
    encoding: UTF-8
    validate-on-migrate: true
    baseline-on-migrate: true
    connect-retries: 30
  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 10MB
  application:
    name: tea-mall-backend
  lifecycle:
    timeout-per-shutdown-phase: 30s  # P0#23: 优雅停机等待超时时间
  datasource:
    # 连接池参数在 DynamicDataSourceConfig 中通过 @ConfigurationProperties 绑定
    # 此处仅保留 driver/url 等基础属性供 Flyway 和 actuator 使用
    driver-class-name: com.mysql.cj.jdbc.Driver
  data:
    redis:
      # 从环境变量 REDIS_HOST 读取，默认值为 redis (docker 内部服务名)
      host: ${REDIS_HOST:redis}
      # 从环境变量 REDIS_PORT 读取，默认值为 6379
      port: ${REDIS_PORT:6379}
      # 生产环境必须通过环境变量 REDIS_PASSWORD 设置强密码，默认为空仅用于本地开发
      password: ${REDIS_PASSWORD:}
      database: 0
      timeout: 3000                    # Redis命令超时时间（毫秒）
      connect-timeout: 5000            # Redis连接超时时间（毫秒）
      lettuce:
        pool:
          max-active: 8
          max-wait: 2000ms  # P1#25: 设置最大等待时间，避免连接池耗尽时无限等待

mybatis-plus:
  mapper-locations: classpath*:/mapper/**/*.xml
  type-aliases-package: com.xytgy.teamallbackend.module.*.entity
  configuration:
    map-underscore-to-camel-case: true
    log-impl: org.apache.ibatis.logging.slf4j.Slf4jImpl


server:
  port: ${SERVER_PORT:8082}
  shutdown: graceful  # P0#23: 启用优雅停机，等待请求处理完毕后再关闭
  tomcat:
    threads:
      max: 400
      min-spare: 50
    accept-count: 100
    max-connections: 10000
    connection-timeout: 3000

jwt:
  # 密钥必须通过环境变量注入，禁止使用默认值（防止令牌伪造）
  secret: ${JWT_SECRET}
  access-token-expiration-ms: 1800000
  refresh-token-expiration-ms: 604800000

knife4j:
  enable: ${KNIFE4J_ENABLE:false}
  setting:
    language: zh_cn

# API 文档访问控制（生产环境应设置为 false）
docs:
  enabled: ${DOCS_ENABLED:false}

mock-pay:
  enabled: ${MOCK_PAY_ENABLED:false}

cache:
  local:
    max-size: 512
    expire-seconds: 60

rocketmq:
  name-server: ${ROCKETMQ_NAMESRV:localhost:9876}
  producer:
    group: tea-mall-producer-group
    send-message-timeout: 3000
    retry-times-when-send-failed: 2

resilience4j:
  circuitbreaker:
    instances:
      redis:
        sliding-window-size: 10
        failure-rate-threshold: 50
        wait-duration-in-open-state: 30s
        permitted-number-of-calls-in-half-open-state: 3
        register-health-indicator: true

flash-sale:
  captcha-pool-size: 1000
  captcha-expire-seconds: 60
  token-expire-seconds: 15
  consumer:
    batch-size: 50
    poll-interval-ms: 100
    thread-count: 4
  rate-limit:
    normal-per-second: 1
    captcha-per-second: 10
    blacklist-per-minute: 100
    blacklist-duration-seconds: 600
  reconcile:
    enabled: true
    interval-ms: 60000
    cleanup-interval-ms: 3600000

app:
  aliyun:
    oss:
      endpoint: ${ALIYUN_OSS_ENDPOINT:}
      accessKeyId: ${ALIYUN_OSS_ACCESS_KEY_ID:}
      accessKeySecret: ${ALIYUN_OSS_ACCESS_KEY_SECRET:}
      bucketName: ${ALIYUN_OSS_BUCKET_NAME:}

cors:
  # 生产环境请通过环境变量 CORS_ALLOWED_ORIGINS 指定具体域名，不要使用 *
  allowed-origins: ${CORS_ALLOWED_ORIGINS:http://localhost:5173}


