spring:
  config:
    activate:
      on-profile: dev
  autoconfigure:
    exclude:
  flyway:
    validate-on-migrate: false
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: jdbc:mysql://${DB_HOST:localhost}:${DB_PORT:3307}/${DB_NAME:cloud_tea_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
    username: ${DB_USERNAME:root}
    password: ${DB_PASSWORD:123456}
    hikari:
      maximum-pool-size: 30
      minimum-idle: 10
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
    read-slave:
      enabled: ${READ_SLAVE_ENABLED:false}
      driver-class-name: com.mysql.cj.jdbc.Driver
      url: jdbc:mysql://${DB_SLAVE_HOST:localhost}:${DB_SLAVE_PORT:3307}/${DB_NAME:cloud_tea_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8
      username: ${DB_SLAVE_USERNAME:root}
      password: ${DB_SLAVE_PASSWORD:dev123456}
      hikari:
        maximum-pool-size: 30
        minimum-idle: 10
        connection-timeout: 3000
        idle-timeout: 600000
        max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6380}
      password: ${REDIS_PASSWORD:redis123456}
  elasticsearch:
    uris: http://localhost:9200
    username: elastic
    password: elastic123456
  kafka:
    bootstrap-servers: localhost:9092
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
    consumer:
      group-id: tea-mall-group
      auto-offset-reset: earliest
      key-deserializer: org.apache.kafka.common.serialization.StringDeserializer
      value-deserializer: org.apache.kafka.common.serialization.StringDeserializer
  devtools:
    restart:
      enabled: true

knife4j:
  enable: true

docs:
  enabled: true

mock-pay:
  enabled: true

jwt:
  # JWT 签名密钥，生产环境必须通过环境变量注入（防止令牌伪造）
  # 生成方式: openssl rand -base64 32
  secret: ${JWT_SECRET:dev-only-secret-for-local-development-only}

alipay:
  enabled: false

app:
  elasticsearch:
    enabled: true

rate-limit:
  login:
    account-max-per-minute: 10
    account-max-per-hour: 30
    account-lockout-minutes: 15
    ip-max-per-minute: 20
    ip-max-per-hour: 100
    ip-lockout-minutes: 15

