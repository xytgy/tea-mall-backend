spring:
  config:
    activate:
      on-profile: prod
  datasource:
    driver-class-name: com.mysql.cj.jdbc.Driver
    url: ${DB_URL:jdbc:mysql://${DB_HOST:mysql}:${DB_PORT:3306}/${DB_NAME:cloud_tea_db}?useSSL=false&serverTimezone=Asia/Shanghai&allowPublicKeyRetrieval=true&characterEncoding=UTF-8}
    username: ${DB_USERNAME:root}
    # 生产环境数据库密码必须通过环境变量注入，禁止使用默认值
    password: ${DB_PASSWORD}
    hikari:
      maximum-pool-size: 50
      minimum-idle: 20
      connection-timeout: 3000
      idle-timeout: 600000
      max-lifetime: 1800000
  data:
    redis:
      host: ${REDIS_HOST}
      port: ${REDIS_PORT:6379}
      password: ${REDIS_PASSWORD:}
  devtools:
    restart:
      enabled: false

mybatis-plus:
  configuration:
    log-impl: org.apache.ibatis.logging.nologging.NoLoggingImpl

knife4j:
  enable: false

# 禁用 API 文档访问
docs:
  enabled: false

cors:
  # 生产环境必须通过环境变量指定具体域名，默认为空（不允许任意来源）
  allowed-origins: ${CORS_ALLOWED_ORIGINS:}

alipay:
  enabled: ${ALIPAY_ENABLED:false}
  app-id: ${ALIPAY_APP_ID:}
  private-key: ${ALIPAY_PRIVATE_KEY:}
  alipay-public-key: ${ALIPAY_PUBLIC_KEY:}
  server-url: ${ALIPAY_SERVER_URL:https://openapi.alipay.com/gateway.do}
  notify-url: ${ALIPAY_NOTIFY_URL:}
  return-url: ${ALIPAY_RETURN_URL:}

lock:
  default-wait-ms: ${LOCK_DEFAULT_WAIT_MS:200}
  default-lease-ms: ${LOCK_DEFAULT_LEASE_MS:30000}

rate-limit:
  login:
    account-max-per-minute: ${RATE_LIMIT_ACCOUNT_MIN:10}
    account-max-per-hour: ${RATE_LIMIT_ACCOUNT_HOUR:30}
    account-lockout-minutes: ${RATE_LIMIT_ACCOUNT_LOCKOUT:15}
    ip-max-per-minute: ${RATE_LIMIT_IP_MIN:20}
    ip-max-per-hour: ${RATE_LIMIT_IP_HOUR:100}
    ip-lockout-minutes: ${RATE_LIMIT_IP_LOCKOUT:15}
