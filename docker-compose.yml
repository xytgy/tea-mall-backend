name: tea-mall

services:
  mysql:
    image: mysql:8.0
    container_name: tea-mall-mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD}
      MYSQL_DATABASE: cloud_tea_db
      TZ: Asia/Shanghai
    ports:
      - "3307:3306"
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/init:/docker-entrypoint-initdb.d
      - ./docker/nacos/mysql-schema.sql:/opt/nacos/mysql-schema.sql:ro
    command: >
      --character-set-server=utf8mb4
      --collation-server=utf8mb4_0900_ai_ci
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h 127.0.0.1 -uroot -p$$MYSQL_ROOT_PASSWORD | grep alive"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped

  redis:
    image: redis:7
    container_name: tea-mall-redis
    ports:
      - "6380:6379"
    command: >
      redis-server
      --appendonly yes
      --requirepass ${REDIS_PASSWORD}
    volumes:
      - redis-data:/data
    restart: unless-stopped

  nacos1:
    image: nacos/nacos-server:v2.3.2
    container_name: tea-mall-nacos1
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD}
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8848:8848"
      - "9848:9848"
      - "9849:9849"
    restart: unless-stopped

  nacos2:
    image: nacos/nacos-server:v2.3.2
    container_name: tea-mall-nacos2
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD}
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8849:8848"
      - "9850:9848"
      - "9851:9849"
    restart: unless-stopped

  nacos3:
    image: nacos/nacos-server:v2.3.2
    container_name: tea-mall-nacos3
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      MODE: cluster
      PREFER_HOST_MODE: hostname
      SPRING_DATASOURCE_PLATFORM: mysql
      MYSQL_SERVICE_HOST: mysql
      MYSQL_SERVICE_PORT: 3306
      MYSQL_SERVICE_DB_NAME: nacos_config
      MYSQL_SERVICE_USER: nacos
      MYSQL_SERVICE_PASSWORD: ${NACOS_MYSQL_PASSWORD}
      NACOS_SERVERS: nacos1:8848 nacos2:8848 nacos3:8848
      JVM_XMS: 256m
      JVM_XMX: 256m
      JVM_XMN: 128m
    ports:
      - "8850:8848"
      - "9852:9848"
      - "9853:9849"
    restart: unless-stopped

  rocketmq-namesrv:
    image: apache/rocketmq:5.3.0
    platform: linux/amd64
    container_name: tea-mall-rocketmq-namesrv
    command: nameserver
    ports:
      - "9876:9876"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/9876' || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 10
      start_period: 30s
    restart: unless-stopped

  rocketmq-broker:
    image: apache/rocketmq:5.3.0
    platform: linux/amd64
    container_name: tea-mall-rocketmq-broker
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        chown -R rocketmq:rocketmq /home/rocketmq/store /home/rocketmq/logs
        cd /home/rocketmq/rocketmq-5.3.0/bin
        exec runuser -u rocketmq -- ./docker-entrypoint.sh broker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.0/conf/broker.conf
    ports:
      - "10911:10911"
      - "10909:10909"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./docker/rocketmq/broker.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker.conf
      - rocketmq-broker-data:/home/rocketmq/store
      - rocketmq-broker-logs:/home/rocketmq/logs
    restart: unless-stopped

  rocketmq-broker-slave:
    image: apache/rocketmq:5.3.0
    platform: linux/amd64
    container_name: tea-mall-rocketmq-broker-slave
    user: root
    entrypoint: ["/bin/bash", "-c"]
    command:
      - |
        chown -R rocketmq:rocketmq /home/rocketmq/store /home/rocketmq/logs
        cd /home/rocketmq/rocketmq-5.3.0/bin
        exec runuser -u rocketmq -- ./docker-entrypoint.sh broker -n rocketmq-namesrv:9876 -c /home/rocketmq/rocketmq-5.3.0/conf/broker-slave.conf
    ports:
      - "10811:10911"
      - "10809:10909"
    environment:
      JAVA_OPT_EXT: "-Xms256m -Xmx256m"
      NAMESRV_ADDR: "rocketmq-namesrv:9876"
    depends_on:
      rocketmq-namesrv:
        condition: service_healthy
      rocketmq-broker:
        condition: service_healthy
    healthcheck:
      test: ["CMD-SHELL", "bash -c '</dev/tcp/127.0.0.1/10911' || exit 1"]
      interval: 15s
      timeout: 10s
      retries: 10
      start_period: 60s
    volumes:
      - ./docker/rocketmq/broker-slave.conf:/home/rocketmq/rocketmq-5.3.0/conf/broker-slave.conf
      - rocketmq-slave-data:/home/rocketmq/store
      - rocketmq-slave-logs:/home/rocketmq/logs
    restart: unless-stopped

  elasticsearch:
    image: docker.elastic.co/elasticsearch/elasticsearch:8.17.0
    container_name: tea-mall-es
    environment:
      discovery.type: single-node
      ELASTIC_PASSWORD: ${ES_PASSWORD}
      xpack.security.enabled: "true"
      xpack.security.http.ssl.enabled: "false"
      xpack.security.transport.ssl.enabled: "false"
      ES_JAVA_OPTS: "-Xms512m -Xmx512m"
    ports:
      - "9200:9200"
    volumes:
      - es-data:/usr/share/elasticsearch/data
    restart: unless-stopped

  skywalking-oap:
    image: docker.1ms.run/apache/skywalking-oap-server:8.9.0
    container_name: tea-mall-skywalking-oap
    ports:
      - "11800:11800"
      - "12800:12800"
    environment:
      SW_STORAGE: h2
      SW_HEALTH_CHECKER: default
      JAVA_OPTS: "-Xms256m -Xmx256m"
    restart: unless-stopped

  skywalking-ui:
    image: docker.1ms.run/apache/skywalking-ui:8.9.0
    container_name: tea-mall-skywalking-ui
    depends_on:
      - skywalking-oap
    ports:
      - "8081:8080"
    environment:
      SW_OAP_ADDRESS: http://skywalking-oap:12800
    restart: unless-stopped

  kafka:
    image: bitnami/kafka:3.7
    container_name: tea-mall-kafka
    ports:
      - "9092:9092"
    environment:
      KAFKA_CFG_NODE_ID: 0
      KAFKA_CFG_PROCESS_ROLES: controller,broker
      KAFKA_CFG_CONTROLLER_QUORUM_VOTERS: 0@kafka:9093
      KAFKA_CFG_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093
      KAFKA_CFG_ADVERTISED_LISTENERS: PLAINTEXT://localhost:9092
      KAFKA_CFG_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT
      KAFKA_CFG_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_CFG_LOG_RETENTION_HOURS: 72
    volumes:
      - kafka-data:/bitnami/kafka
    restart: unless-stopped

  canal:
    image: canal/canal-server:v1.1.7
    container_name: tea-mall-canal
    environment:
      TZ: Asia/Shanghai
      canal.instance.master.address: mysql:3306
      canal.instance.dbUsername: canal
      canal.instance.dbPassword: canal
    ports:
      - "11111:11111"
      - "11110:11110"
    depends_on:
      mysql:
        condition: service_healthy
    restart: unless-stopped

  sentinel:
    image: docker.1ms.run/bladex/sentinel-dashboard:1.8.6
    container_name: tea-mall-sentinel
    ports:
      - "8858:8858"
    restart: unless-stopped

  loki:
    image: grafana/loki:3.0.0
    container_name: tea-mall-loki
    ports:
      - "3100:3100"
    volumes:
      - loki-data:/loki
    command: -config.file=/etc/loki/local-config.yaml
    restart: unless-stopped

  promtail:
    image: grafana/promtail:3.0.0
    container_name: tea-mall-promtail
    volumes:
      - /var/run/docker.sock:/var/run/docker.sock
      - ./docker/loki/promtail-config.yml:/etc/promtail/config.yml
    command: -config.file=/etc/promtail/config.yml
    depends_on:
      - loki
    restart: unless-stopped

  grafana:
    image: grafana/grafana:11.0.0
    container_name: tea-mall-grafana
    ports:
      - "3000:3000"
    environment:
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: admin
    volumes:
      - grafana-data:/var/lib/grafana
    restart: unless-stopped

volumes:
  mysql-data:
  redis-data:
  es-data:
  rocketmq-broker-data:
  rocketmq-broker-logs:
  rocketmq-slave-data:
  rocketmq-slave-logs:
  kafka-data:
  loki-data:
  grafana-data:
